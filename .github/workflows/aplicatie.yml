name: Aplicație — verificare și publicare

on:
  push:
    branches: [main]
    paths:
      - aplicatie-partial/**
      - .github/workflows/aplicatie.yml
  pull_request:
    paths:
      - aplicatie-partial/**
      - .github/workflows/aplicatie.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: aplicatie-partial

jobs:
  verify:
    name: Teste și build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aplicatie-partial/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx --no-install wrangler deploy --dry-run --outdir .wrangler/dry-run

  deploy:
    name: Publicare Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aplicatie-partial/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publică aplicația protejată
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
